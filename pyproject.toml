[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-viewer"
version = "0.1.0"
description = "Visualizador interativo de barras elétricas georreferenciadas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "PyQt6>=6.7,<7",
    "pyproj>=3.5,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
]
# O motor do OpenDSS é opcional: sem ele a aplicação roda inteira, apenas com o
# botão "Executar Fluxo de Potência" desabilitado e o motivo na dica.
opendss = [
    "py-dss-interface>=2.3,<3",
]
# A leitura de bancos Access é opcional pelo mesmo motivo, e ainda depende de um
# driver ODBC externo — o Microsoft Access Database Engine Redistributable, na
# mesma arquitetura do Python. Sem os dois, apenas "Importar banco de dados…"
# fica desabilitado, com o motivo na dica.
mdb = [
    "pyodbc>=5.1,<6",
]

[project.scripts]
circuit-viewer = "circuit_viewer.__main__:main"

[tool.setuptools.packages.find]
include = ["circuit_viewer*"]

[tool.setuptools.package-data]
circuit_viewer = [
    "config/*.json",
    "dados/cabos.json",
    "dados/geometrias.json",
    "dados/mapa_cabos.json",
    "dados/mapa_arranjos.json",
    "vendor/*.txt",
    "vendor/*.md",
    "vendor/graphviz-15.1.1-win64/bin/*",
    "vendor/graphviz-15.1.1-win64/include/*",
    "vendor/graphviz-15.1.1-win64/include/graphviz/*",
    "vendor/graphviz-15.1.1-win64/lib/*",
    "vendor/graphviz-15.1.1-win64/lib/cmake/*",
    "vendor/graphviz-15.1.1-win64/lib/cmake/graphviz/*",
    "vendor/graphviz-15.1.1-win64/lib/graphviz/*",
    "vendor/graphviz-15.1.1-win64/lib/graphviz/tcl/*",
    "vendor/graphviz-15.1.1-win64/lib/pkgconfig/*",
    "vendor/graphviz-15.1.1-win64/share/graphviz/*",
    "vendor/graphviz-15.1.1-win64/share/graphviz/graphs/*",
    "vendor/graphviz-15.1.1-win64/share/graphviz/graphs/directed/*",
    "vendor/graphviz-15.1.1-win64/share/graphviz/graphs/undirected/*",
    "vendor/graphviz-15.1.1-win64/share/graphviz/gvpr/*",
    "vendor/graphviz-15.1.1-win64/share/man/*",
    "vendor/graphviz-15.1.1-win64/share/man/man1/*",
    "vendor/graphviz-15.1.1-win64/share/man/man3/*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
