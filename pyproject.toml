[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-viewer"
version = "0.1.0"
description = "Visualizador interativo de barras elétricas georreferenciadas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "PyQt6>=6.7,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
circuit-viewer = "circuit_viewer.__main__:main"

[tool.setuptools.packages.find]
include = ["circuit_viewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

